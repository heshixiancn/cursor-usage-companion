[package]
name = "usage-companion"
version = "0.1.0"
description = "A compliant cross-platform usage and credential companion"
authors = ["github-discover"]
edition = "2021"

[lib]
name = "usage_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
keyring = "4.2"

